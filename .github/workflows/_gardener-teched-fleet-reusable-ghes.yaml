"jobs":
  "apply-manifest":
    "env":
      "NAMESPACE": "${{ inputs.namespace }}"
      "SHOOT_NAME": "${{ inputs.shoot_name }}"
    "runs-on": "${{ fromJSON(inputs.runner) }}"
    "steps":
    - "name": "Check out Git repository"
      "uses": "actions/checkout@v4"
    - "name": "Install Helm"
      "uses": "azure/setup-helm@v4"
    - "id": "coords"
      "name": "Resolve teched coords (GHES: KEB via kyma_env_uuid · github.com: baked
        static — fork-safe, no secret, no GUID)"
      "run": |
        set -e
        SHOOT="${{ inputs.shoot_name }}"
        # Coords + audience differ by GitHub host (the id-token issuer auto-differs; the cluster federates BOTH). GHES
        # (github.tools.sap/_services/token, internal repo) → live KEB fetch by kyma_env_uuid + gh-<shoot> audience.
        # github.com fork → server/ca from the baked static map (NO GUID) + gh-teched-<subaccount_id> audience.
        if [ "${{ github.repository }}" = "fp-stakeholder-management/terraform-stories" ]; then
          UUID="${{ inputs.kyma_env_uuid }}"
          TMP=$(mktemp)
          curl -s "https://kyma-env-broker.cp.kyma.cloud.sap/kubeconfig/$UUID" -o "$TMP"
          SERVER=$(kubectl --kubeconfig "$TMP" config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          CA=$(kubectl --kubeconfig "$TMP" config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
          rm -f "$TMP"
          AUD="gh-$SHOOT"                                # GHES federation gh-<shoot> (e.g. gh-xp266-001)
        else
          STATIC='{"xp266-001":{"ca":"","server":"https://api.c-0010ccb.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-002":{"ca":"","server":"https://api.c-566a0db.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-003":{"ca":"","server":"https://api.c-12bbea2.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-011":{"ca":"","server":"https://api.c-95997a2.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"fd4c1e9c-d70a-45fc-8ffb-b3bee02a0055"},"xp266-012":{"ca":"","server":"https://api.ea7a0c9.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"fd4c1e9c-d70a-45fc-8ffb-b3bee02a0055"}}'   # baked at apply from fleet.auto.tfvars; NO kyma_env_uuid
          SERVER=$(echo "$STATIC" | jq -r --arg s "$SHOOT" '.[$s].server')
          CA=$(echo "$STATIC"     | jq -r --arg s "$SHOOT" '.[$s].ca')
          AUD="gh-teched-$SHOOT"                          # github.com federation: usernameClaim=aud → username = the audience;
                                                          # CRB user-gha-teched binds actions-oidc:gh-teched-<shoot> (verified xp266-001)
        fi
        [ -n "$SERVER" ] && [ -n "$CA" ] || { echo "ERROR: no server/CA for $SHOOT"; exit 1; }
        echo "server=$SERVER"   >> "$GITHUB_OUTPUT"
        echo "ca=$CA"           >> "$GITHUB_OUTPUT"
        echo "audience=$AUD"    >> "$GITHUB_OUTPUT"
        echo "idp=anuk8cmfw"    >> "$GITHUB_OUTPUT"
        echo "coords(teched): server=$SERVER audience=$AUD"
    - "name": "Setup Kube Context"
      "uses": "azure/k8s-set-context@v4"
      "with":
        "kubeconfig": |
          "apiVersion": "v1"
          "clusters":
          - "cluster":
              "certificate-authority-data": "${{ steps.coords.outputs.ca }}"
              "server": "${{ steps.coords.outputs.server }}"
            "name": "${{ inputs.shoot_name }}"
          "contexts":
          - "context":
              "cluster": "${{ inputs.shoot_name }}"
              "user": "${{ inputs.shoot_name }}"
            "name": "${{ inputs.shoot_name }}"
          "current-context": "${{ inputs.shoot_name }}"
          "kind": "Config"
          "users":
          - "name": "${{ inputs.shoot_name }}"
            "user":
              "exec":
                "apiVersion": "client.authentication.k8s.io/v1"
                "args":
                - "-c"
                - |
                  set -e -o pipefail
                  OIDC_URL_WITH_AUDIENCE="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ steps.coords.outputs.audience }}"
                  IDTOKEN=$(curl -sS \
                    -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    -H "Accept: application/json; api-version=2.0" \
                    "$OIDC_URL_WITH_AUDIENCE" | jq -r .value)
                  EXP_TS=$(echo $IDTOKEN | jq -R 'split(".") | .[1] | @base64d | fromjson | .exp')
                  EXP_DATE=$(date -d @$EXP_TS --iso-8601=seconds)
                  echo "{\"apiVersion\":\"client.authentication.k8s.io/v1\",\"kind\":\"ExecCredential\",\"status\":{\"token\":\"$IDTOKEN\",\"expirationTimestamp\":\"$EXP_DATE\"}}"
                "command": "bash"
                "interactiveMode": "Never"
        "method": "kubeconfig"
    - "name": "Generate native kube-system SA kubeconfig (teched — VAP-exempt)"
      "run": |
        curl -fsSL "https://github.com/kyma-project/cli/releases/latest/download/kyma_Linux_x86_64.tar.gz" | tar xz -C /tmp kyma
        /tmp/kyma alpha kubeconfig generate --serviceaccount bootstrapper --clusterrole cluster-admin \
          --namespace kube-system --cluster-wide --time 3h --output /tmp/native-sa.yaml
        cp /tmp/native-sa.yaml "$KUBECONFIG"
        echo "teched: native kube-system:bootstrapper SA (VAP-exempt) minted from the GitHub-OIDC identity"
    - "name": "check permissions"
      "run": |
        kubectl auth can-i --list --namespace $NAMESPACE
        kubectl get nodes
        kubectl get pod -A
        kubectl get cm/shoot-info -n kube-system -o json | jq .data
        kubectl get openidconnect 2>/dev/null || true
    - "name": "Install kyma CLI"
      "run": |
        curl -sSL "https://github.com/kyma-project/cli/releases/latest/download/kyma_Linux_x86_64.tar.gz" | tar -xzv kyma
        chmod +x kyma
        ./kyma version || true
    - "id": "diagnose"
      "name": "kyma diagnose cluster"
      "run": |
        ./kyma alpha diagnose cluster -f json > /tmp/diagnose.json || true
        cat /tmp/diagnose.json | jq -r '.metadata' || true
        jq '
          if .events then
            .events |= (
              group_by(.reason + ":" + .message)
              | map({ reason: .[0].reason, message: .[0].message, namespace: .[0].involvedObject.namespace, count: (map(.count // 1) | add) })
              | sort_by(-.count) | .[0:50]
            )
          else . end
        ' /tmp/diagnose.json > /tmp/diagnose_dedup.json 2>/dev/null || cp /tmp/diagnose.json /tmp/diagnose_dedup.json
    - "id": "cluster_info"
      "name": "BTP runtime context access"
      "run": |
        IDP_FQDN="${{ steps.coords.outputs.idp }}.accounts.ondemand.com"
        DEEPLINK=$(cat /tmp/diagnose.json | jq -r --arg idp "$IDP_FQDN" \
          '.metadata | "https://emea.cockpit.btp.cloud.sap/cockpit?idp=\($idp)#/globalaccount/" + .globalAccountID + "/subaccount/" + .subaccountID')
        echo "BTP Deeplink: $DEEPLINK"
        GLOBALACCOUNT=$(cat /tmp/diagnose.json | jq -r '.metadata.globalAccountID')
        echo "GLOBALACCOUNT=$GLOBALACCOUNT" >> $GITHUB_OUTPUT
        echo "BTP_DEEPLINK=$DEEPLINK" >> $GITHUB_OUTPUT
    - "id": "HTTPBIN_URL"
      "name": "deploy httpbin via kyma app push"
      "run": |2
            kubectl delete all -l app.kubernetes.io/name=httpbin-$NAMESPACE -n $NAMESPACE || true
            ./kyma app push \
              --name httpbin-$NAMESPACE \
              --image ghcr.io/mccutchen/go-httpbin:latest \
              --istio-inject true \
              --quiet \
              --container-port 8080 \
              --namespace $NAMESPACE
            kubectl patch deployment httpbin-$NAMESPACE -n $NAMESPACE --type=json \
              -p '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]' || true
            kubectl rollout status deployment/httpbin-$NAMESPACE -n $NAMESPACE --timeout=30s || true

            # Teched serves on quovadis.kyma.dev.sap (aws simple-gateway).
            SERVE_DOMAIN="quovadis.kyma.dev.sap"
            GATEWAY="quovadis-k3d/kyma-aws-gateway-simple"
            CUSTOM_HOST="httpbin-$NAMESPACE.$SHOOT_NAME.$SERVE_DOMAIN"

            kubectl apply -n $NAMESPACE -f - <<APIRULE
        apiVersion: gateway.kyma-project.io/v2
        kind: APIRule
        metadata:
          name: httpbin-$NAMESPACE-custom
          namespace: $NAMESPACE
        spec:
          hosts:
            - "$CUSTOM_HOST"
          service:
            name: httpbin-$NAMESPACE
            port: 8080
          gateway: $GATEWAY
          rules:
            - path: /*
              methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
              noAuth: true
        APIRULE

            echo "HTTPBIN_URL=https://$CUSTOM_HOST" >> $GITHUB_OUTPUT
            echo "## Cluster Links — $SHOOT_NAME (teched)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            DOMAIN="$SHOOT_NAME.$SERVE_DOMAIN"
            echo "- **httpbin:** [https://$CUSTOM_HOST/headers](https://$CUSTOM_HOST/headers)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Busola:** [https://monsoon3.$DOMAIN/kubeconfig](https://monsoon3.$DOMAIN/kubeconfig)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Headlamp:** [https://headlamp.$DOMAIN](https://headlamp.$DOMAIN)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Keycloak:** [https://keycloak.$DOMAIN](https://keycloak.$DOMAIN)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **SCC:** [https://sapcc.$DOMAIN](https://sapcc.$DOMAIN)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **OpenClaw:** [https://openclaw.$DOMAIN](https://openclaw.$DOMAIN)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **n8n:** [https://n8n.$DOMAIN](https://n8n.$DOMAIN)" >> "$GITHUB_STEP_SUMMARY"
            BTP_DEEPLINK="${{ steps.cluster_info.outputs.BTP_DEEPLINK }}"
            GLOBALACCOUNT="${{ steps.cluster_info.outputs.GLOBALACCOUNT }}"
            [ -n "$BTP_DEEPLINK" ] && echo "- **BTP Cockpit:** [$GLOBALACCOUNT]($BTP_DEEPLINK)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
    - "name": "community modules catalog"
      "run": |
        echo 'discover/add available community-driven modules...'
        ./kyma module catalog | tee /tmp/module_catalog.txt || true
    - "name": "simulate load on httpbin"
      "run": |
        URL="${{ steps.HTTPBIN_URL.outputs.HTTPBIN_URL }}/headers"
        for i in $(seq 1 30); do
          [ "$(curl -skS "$URL")" != "no healthy upstream" ] && break
          echo "Attempt $i/30 — no healthy upstream, retrying in 6s..."
          sleep 6
        done
        for f in {1..10}; do curl -skS "$URL"; done
        echo "You can check logs/metrics/traces in SAP Cloud Logging: https://url.sap/rw43o5"
    - "env":
        "BTP_DEEPLINK": "${{ steps.cluster_info.outputs.BTP_DEEPLINK }}"
        "BTP_GLOBALACCOUNT": "${{ steps.cluster_info.outputs.GLOBALACCOUNT }}"
        "GOOSE_IDP": "${{ steps.coords.outputs.idp }}"
        "GOOSE_MODE": "${{ inputs.goose_mode }}"
        "KEEP_SANDBOX": "${{ inputs.keep_sandbox }}"
      "name": "Goose — interpret cluster health"
      "run": |2
                # LIVE (Investigate) mode: goose drives read-only kubectl in an explicit-policy OpenShell sandbox (headless
                # client-creds), via ci-goose-via-sandbox-live.sh which self-loads the CH v2 prompt from the dev-toolbox-prompts CM.
                # The script skips cleanly where OpenShell/dev-toolbox aren't deployed, so a non-openshell shoot is a no-op.
                if [ "$GOOSE_MODE" = "live" ]; then
                  echo "## Cluster Health (LIVE investigate) — $SHOOT_NAME" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  KEEP_SANDBOX="$KEEP_SANDBOX" NAME="ci-goose-live-${{ github.run_id }}-${{ github.run_attempt }}" \
                    "$GITHUB_WORKSPACE/.github/scripts/ci-goose-via-sandbox-live.sh" >/tmp/goose_report.md 2>/dev/null || true
                  cp -f /tmp/goose_report.md /tmp/goose_out.txt   # report-only input for the downstream "open GitHub issue" step (clean grep)
                  cat /tmp/goose_live_header.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true   # provenance (agent/model/proxy) + the prompt used
                  cat /tmp/goose_report.md >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                # ---- SNAPSHOT (Report) mode (default): goose interprets the kyma-diagnose snapshot, no tools ----
                MAX_EVENTS_BYTES=51200
                DIAGNOSE_BASE=$(jq 'del(.events)' /tmp/diagnose_dedup.json 2>/dev/null || echo "{}")
                BASE_SIZE=${#DIAGNOSE_BASE}
                EVENTS_BUDGET=$((MAX_EVENTS_BYTES - BASE_SIZE))
                if [ "$EVENTS_BUDGET" -gt 0 ]; then
                  EVENTS=$(jq '.events // []' /tmp/diagnose_dedup.json 2>/dev/null)
                  EVENTS_TRUNC=$(echo "$EVENTS" | head -c "$EVENTS_BUDGET")
                  DIAGNOSE=$(echo "$DIAGNOSE_BASE" | jq --argjson ev "$EVENTS_TRUNC" '. + {events: $ev}' 2>/dev/null || echo "$DIAGNOSE_BASE")
                else
                  DIAGNOSE="$DIAGNOSE_BASE"
                fi
                DIAGNOSE_TRUNC=$(echo "$DIAGNOSE" | head -c 65536)
                echo "## Cluster Health — $SHOOT_NAME" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                cat > /tmp/goose_prompt.txt << 'ENDPROMPT'
        You are a Kyma/Kubernetes cluster health expert.
        ENDPROMPT
                cat >> /tmp/goose_prompt.txt << ENDPROMPT
        Cluster: $SHOOT_NAME
        IDP: $GOOSE_IDP
        BTP Global Account: $BTP_GLOBALACCOUNT
        BTP Deeplink: $BTP_DEEPLINK

        Here is the diagnostic output from 'kyma alpha diagnose cluster' (truncated):
        $DIAGNOSE_TRUNC

        Community modules catalog:
        $(cat /tmp/module_catalog.txt 2>/dev/null || echo "not available")

        IMPORTANT: Do not use any tools. Answer only from the diagnostic data provided above.

        Please:
        1. Summarize the cluster health status in 3-5 bullet points
        2. Identify any critical issues or warnings
        3. Suggest concrete remediation steps for any issues found
        4. Highlight BTP subaccount connectivity status
        5. Note any Kyma module issues and list available community modules

        IMPORTANT k3d-specific context: AppArmor "Cannot enforce AppArmor" events are EXPECTED and BENIGN on k3d clusters.

        Be concise and actionable. Format output as GitHub-flavoured markdown. Start with a ## heading.
        ENDPROMPT
                # Run goose over the diagnostic data. The helper prefers a KEYLESS in-cluster OpenShell sandbox (no real key on
                # the runner or in the box; via LiteLLM -> SAP AI Core) and falls back to runner-local goose where OpenShell
                # isn't deployed. A single call keeps the CI log clean (no dual-branch echo).
                NAME="ci-goose-${{ github.run_id }}-${{ github.run_attempt }}" \
                  "$GITHUB_WORKSPACE/.github/scripts/ci-goose-via-sandbox.sh" /tmp/goose_prompt.txt \
                  2>&1 | tee /tmp/goose_out.txt || true
                sed 's/\x1B\[[0-9;]*[mGKHF]//g' /tmp/goose_out.txt | tr -d '\r' \
                  | python3 -c "
        import sys, re
        out = sys.stdin.read()
        out = re.sub(r'^[^\n]*(?:new session|goose is ready|\( O\)|___+\)|L L\s|─{5,}|▸ todo_write)[^\n]*\n', '', out, flags=re.MULTILINE)
        out = re.sub(r'content:.*?\n\n', '', out, flags=re.DOTALL)
        out = re.sub(r'▸ \S+.*?\n(?:[ \t]+[^\n]*\n)*\n?', '', out, flags=re.DOTALL)
        out = out.lstrip('\n')
        print(out.strip())
        " | tee /tmp/goose_report.md >> "$GITHUB_STEP_SUMMARY"
    - "if": "always()"
      "name": "Upload goose health report (v3)"
      "uses": "actions/upload-artifact@v7"
      "with":
        "if-no-files-found": "ignore"
        "name": "goose-health-${{ inputs.shoot_name }}"
        "path": "/tmp/goose_report.md"
        "retention-days": 14
    - "env":
        "GH_ISSUE_TOKEN": "${{ secrets.GH_ISSUE_TOKEN }}"
      "name": "Goose — open GitHub issue for critical findings"
      "run": |
        export PATH="$HOME/.local/bin:$PATH"
        HEALTH=$(sed 's/\x1B\[[0-9;]*[mGKHF]//g' /tmp/goose_out.txt)
        # Fork-safe: a public fork has no GH_ISSUE_TOKEN secret → skip issue creation (report is still in the summary/artifact).
        if [ -z "$GH_ISSUE_TOKEN" ]; then
          echo "No GH_ISSUE_TOKEN (fork without secrets) — skipping issue creation"
        elif echo "$HEALTH" | grep -qiE 'critical|crashing|crashloop|failed module|connectivity outage|outage|error.*client|client.*error|bottleneck|overload|not found|unavailable'; then
          TITLE="[$SHOOT_NAME] Critical cluster health findings — $(date -u +%Y-%m-%d)"
          BODY=$(printf '## Critical Cluster Health Findings\n\n**Cluster:** `%s`\n**IDP:** %s\n**Detected:** %s\n**Workflow run:** %s/%s/actions/runs/%s\n\n---\n\n%s' \
            "$SHOOT_NAME" "${{ steps.coords.outputs.idp }}" "$(date -u --iso-8601=seconds)" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" "$HEALTH")
          # github.api_url is host-correct: https://api.github.com (github.com) / https://github.tools.sap/api/v3 (GHES).
          curl -fsSL -X POST \
            -H "Authorization: token $GH_ISSUE_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg title "$TITLE" --arg body "$BODY" '{title: $title, body: $body}')" \
            || echo "issue creation failed (non-fatal) — see the report in the step summary/artifact"
        else
          echo "No critical findings — skipping issue creation"
        fi
"name": "_gardener-teched-fleet-reusable-ghes"
"on":
  "workflow_call":
    "inputs":
      "goose_mode":
        "default": "snapshot"
        "description": "Goose mode: snapshot (interpret kyma-diagnose output, no tools)
          OR live (read-only kubectl investigation in an OpenShell sandbox; skips
          where OpenShell absent)"
        "type": "string"
      "keep_sandbox":
        "default": false
        "description": "Live mode only: keep the sandbox alive after the run so students
          can inspect its logs (default: delete it)"
        "type": "boolean"
      "kyma_env_uuid":
        "description": "Kyma env UUID — KEB key on GHES; empty on github.com (static
          bake)"
        "required": true
        "type": "string"
      "namespace":
        "default": "quovadis-k3d"
        "description": "Target namespace"
        "type": "string"
      "runner":
        "default": "[\"ubuntu-latest\"]"
        "description": "JSON-encoded runner labels"
        "type": "string"
      "shoot_name":
        "description": "Kyma env name (e.g. xp266-001)"
        "required": true
        "type": "string"
      "subaccount_id":
        "description": "BTP subaccount id"
        "required": true
        "type": "string"
    "secrets":
      "GH_ISSUE_TOKEN":
        "description": "GitHub token for opening issues on critical findings"
        "required": false
"permissions":
  "contents": "read"
  "id-token": "write"
  "issues": "write"
