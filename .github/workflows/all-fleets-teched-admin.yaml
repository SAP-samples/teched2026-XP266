"jobs":
  "deploy-teched":
    "if": "${{ needs.setup.outputs.matrix != '' && github.repository != 'fp-stakeholder-management/terraform-stories'
      }}"
    "needs": "setup"
    "secrets":
      "GH_ISSUE_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
    "strategy":
      "fail-fast": false
      "matrix": "${{ fromJSON(needs.setup.outputs.matrix) }}"
    "uses": "./.github/workflows/_gardener-teched-fleet-reusable.yaml"
    "with":
      "goose_mode": "${{ inputs.goose_mode }}"
      "keep_sandbox": "${{ inputs.keep_sandbox }}"
      "kyma_env_uuid": "${{ matrix.kyma_env_uuid }}"
      "namespace": "${{ matrix.shoot_name }}"
      "runner": "[\"ubuntu-latest\"]"
      "shoot_name": "${{ matrix.shoot_name }}"
      "subaccount_id": "${{ matrix.subaccount_id }}"
  "deploy-teched-ghes":
    "if": "${{ needs.setup.outputs.matrix != '' && github.repository == 'fp-stakeholder-management/terraform-stories'
      }}"
    "needs": "setup"
    "secrets":
      "GH_ISSUE_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
    "strategy":
      "fail-fast": false
      "matrix": "${{ fromJSON(needs.setup.outputs.matrix) }}"
    "uses": "./.github/workflows/_gardener-teched-fleet-reusable-ghes.yaml"
    "with":
      "goose_mode": "${{ inputs.goose_mode }}"
      "keep_sandbox": "${{ inputs.keep_sandbox }}"
      "kyma_env_uuid": "${{ matrix.kyma_env_uuid }}"
      "namespace": "${{ matrix.shoot_name }}"
      "runner": "[\"self-hosted\",\"solinas-ubuntu_22_04\"]"
      "shoot_name": "${{ matrix.shoot_name }}"
      "subaccount_id": "${{ matrix.subaccount_id }}"
  "setup":
    "outputs":
      "matrix": "${{ steps.m.outputs.matrix }}"
    "runs-on": "${{ github.repository == 'fp-stakeholder-management/terraform-stories'
      && fromJSON('[\"self-hosted\",\"solinas-ubuntu_22_04\"]') || fromJSON('[\"ubuntu-latest\"]')
      }}"
    "steps":
    - "name": "Check out repository (teched registry)"
      "uses": "actions/checkout@v7"
    - "id": "m"
      "name": "Build teched subaccount × cluster matrix (GHES: teched.auto.tfvars
        · github.com: baked static — no GUID)"
      "run": |
        # Two role dropdowns → one TARGET: the student's cluster wins; else the instructor's subaccount/'all'; else guide.
        SC="${{ inputs.student_cluster }}"; IS="${{ inputs.instructor_subaccount }}"
        if [ "$SC" != "none" ] && [ -n "$SC" ]; then TARGET="$SC"
        elif [ "$IS" != "none" ] && [ -n "$IS" ]; then
          # Instructor mode (a subaccount = all its clusters, or 'all') is restricted to the UPSTREAM repos —
          # student FORKS cannot run it (the input is still shown, but rejected here). Students use Student admin only.
          case "${{ github.repository }}" in
            SAP-samples/teched2026-XP266|fp-stakeholder-management/terraform-stories) TARGET="$IS" ;;
            *) echo "::error::Instructor admin (teched-NN / all) is only available in the upstream repo — a fork can run Student admin (your own xp266-NNN) only."; exit 1 ;;
          esac
        else echo "::error::Pick your cluster (Student admin = xp266-NNN) OR a subaccount (Instructor admin = teched-NN)."; exit 1
        fi
        if [ "${{ github.repository }}" = "fp-stakeholder-management/terraform-stories" ]; then
          # GHES (internal): parse the checked-out registry at runtime (carries kyma_env_uuid).
          MATRIX=$(awk -v T="$TARGET" '
            /^  "teched-[0-9]+"[ ]*=/  { n=$1; gsub(/[",]/,"",n); name=n }
            /^[ ]*subaccount_id[ ]*=/  { s=$3; gsub(/[",]/,"",s); subid=s }
            /^[ ]*kyma_env_name[ ]*=/  { e=$3; gsub(/[",]/,"",e); env=e }
            /^[ ]*kyma_env_uuid[ ]*=/  { u=$3; gsub(/[",]/,"",u); if (T=="all"||T==name||T==env) print env "\t" u "\t" subid }
          ' .github/teched/teched.auto.tfvars \
            | jq -R -s -c 'split("\n") | map(select(length>0) | split("\t") | {shoot_name:.[0], kyma_env_uuid:.[1], subaccount_id:.[2]}) | {include: .}')
        else
          # github.com (public fork): baked static map — server/ca resolved in coords; NO kyma_env_uuid here.
          STATIC='{"xp266-001":{"ca":"","server":"https://api.c-0010ccb.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-002":{"ca":"","server":"https://api.c-566a0db.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-003":{"ca":"","server":"https://api.c-12bbea2.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-011":{"ca":"","server":"https://api.c-95997a2.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"fd4c1e9c-d70a-45fc-8ffb-b3bee02a0055"},"xp266-012":{"ca":"","server":"https://api.ea7a0c9.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"fd4c1e9c-d70a-45fc-8ffb-b3bee02a0055"}}'
          MATRIX=$(echo "$STATIC" | jq -c --arg t "$TARGET" '
            to_entries
            | map(select($t=="all" or .key==$t or .value.subaccount_group==$t))
            | map({shoot_name:.key, kyma_env_uuid:"", subaccount_id:.value.subaccount_id})
            | {include: .}')
        fi
        echo "teched matrix (target=$TARGET): $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
"name": "all-fleets-teched-admin"
"on":
  "workflow_dispatch":
    "inputs":
      "goose_mode":
        "default": "snapshot"
        "description": "Agent (goose) reporting mode"
        "options":
        - "snapshot"
        - "live"
        "type": "choice"
      "instructor_subaccount":
        "default": "none"
        "description": "Instructor admin — (teched-NN)"
        "options":
        - "none"
        - "all"
        - "teched-01"
        - "teched-02"
        "type": "choice"
      "keep_sandbox":
        "default": false
        "description": "keep the sandbox"
        "type": "boolean"
      "student_cluster":
        "default": "none"
        "description": "Student admin (xp266-NNN)"
        "options":
        - "none"
        - "xp266-001"
        - "xp266-002"
        - "xp266-003"
        - "xp266-011"
        - "xp266-012"
        "type": "choice"
"permissions":
  "contents": "read"
  "id-token": "write"
  "issues": "write"
