"jobs":
  "deploy-teched":
    "if": "${{ needs.setup.outputs.matrix != '' && github.repository != 'fp-stakeholder-management/terraform-stories'
      }}"
    "needs": "setup"
    "secrets":
      "GH_ISSUE_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
    "strategy":
      "fail-fast": false
      "matrix": "${{ fromJSON(needs.setup.outputs.matrix) }}"
      "max-parallel": 3
    "uses": "./.github/workflows/_gardener-teched-fleet-reusable.yaml"
    "with":
      "goose_mode": "${{ inputs.goose_mode }}"
      "keep_sandbox": "${{ inputs.keep_sandbox }}"
      "kyma_env_uuid": "${{ matrix.kyma_env_uuid }}"
      "namespace": "${{ matrix.shoot_name }}"
      "runner": "[\"ubuntu-latest\"]"
      "shoot_name": "${{ matrix.shoot_name }}"
      "subaccount_id": "${{ matrix.subaccount_id }}"
      "task": "cluster-health"
  "deploy-teched-ghes":
    "if": "${{ needs.setup.outputs.matrix != '' && github.repository == 'fp-stakeholder-management/terraform-stories'
      }}"
    "needs": "setup"
    "secrets":
      "GH_ISSUE_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
    "strategy":
      "fail-fast": false
      "matrix": "${{ fromJSON(needs.setup.outputs.matrix) }}"
      "max-parallel": 3
    "uses": "./.github/workflows/_gardener-teched-fleet-reusable-ghes.yaml"
    "with":
      "goose_mode": "${{ inputs.goose_mode }}"
      "keep_sandbox": "${{ inputs.keep_sandbox }}"
      "kyma_env_uuid": "${{ matrix.kyma_env_uuid }}"
      "namespace": "${{ matrix.shoot_name }}"
      "runner": "[\"self-hosted\",\"solinas-ubuntu_22_04\"]"
      "shoot_name": "${{ matrix.shoot_name }}"
      "subaccount_id": "${{ matrix.subaccount_id }}"
      "task": "cluster-health"
  "setup":
    "outputs":
      "matrix": "${{ steps.m.outputs.matrix }}"
    "runs-on": "${{ github.repository == 'fp-stakeholder-management/terraform-stories'
      && fromJSON('[\"self-hosted\",\"solinas-ubuntu_22_04\"]') || fromJSON('[\"ubuntu-latest\"]')
      }}"
    "steps":
    - "name": "Check out repository (teched registry)"
      "uses": "actions/checkout@v7"
    - "env":
        "IS": "${{ inputs.instructor_subaccount }}"
        "SC": "${{ inputs.student_cluster }}"
      "id": "m"
      "name": "Build teched subaccount × cluster matrix (GHES: teched.auto.tfvars
        · github.com: baked static — no GUID)"
      "run": |
        if [ "$SC" != "none" ] && [ -n "$SC" ]; then TARGET="$SC"
        elif [ "$IS" != "none" ] && [ -n "$IS" ]; then
          case "$GITHUB_REPOSITORY" in
            SAP-samples/teched2026-XP266|fp-stakeholder-management/terraform-stories) TARGET="$IS" ;;
            *) echo "::error::Instructor mode (teched-NN / all) is only available in the upstream repo — a fork runs your own xp266-NNN only."; exit 1 ;;
          esac
        else echo "::error::Pick your cluster (xp266-NNN) OR a subaccount (teched-NN)."; exit 1
        fi
        if [ "$GITHUB_REPOSITORY" = "fp-stakeholder-management/terraform-stories" ]; then
          MATRIX=$(awk -v T="$TARGET" '
            /^  "teched-[0-9]+"[ ]*=/  { n=$1; gsub(/[",]/,"",n); name=n }
            /^[ ]*subaccount_id[ ]*=/  { s=$3; gsub(/[",]/,"",s); subid=s }
            /^[ ]*kyma_env_name[ ]*=/  { e=$3; gsub(/[",]/,"",e); env=e }
            /^[ ]*kyma_env_uuid[ ]*=/  { u=$3; gsub(/[",]/,"",u); if (T=="all"||T==name||T==env) print env "\t" u "\t" subid }
          ' .github/teched/teched.auto.tfvars \
            | jq -R -s -c 'split("\n") | map(select(length>0) | split("\t") | {shoot_name:.[0], kyma_env_uuid:.[1], subaccount_id:.[2]}) | {include: .}')
        else
          STATIC='{"xp266-001":{"ca":"","server":"https://api.c-0010ccb.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-002":{"ca":"","server":"https://api.c-566a0db.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-003":{"ca":"","server":"https://api.c-12bbea2.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-004":{"ca":"","server":"https://api.cbaca8d.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-005":{"ca":"","server":"https://api.c-859b046.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-006":{"ca":"","server":"https://api.e4a83ce.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-007":{"ca":"","server":"https://api.c-2181354.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-008":{"ca":"","server":"https://api.c-18168ef.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-009":{"ca":"","server":"https://api.c-8bb7578.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-010":{"ca":"","server":"https://api.c-52ebad5.kyma.ondemand.com","subaccount_group":"teched-01","subaccount_id":"e2c9ae56-3294-4817-a7ea-cda09b4de2ca"},"xp266-011":{"ca":"","server":"https://api.c-748754d.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-012":{"ca":"","server":"https://api.c-598f02f.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-013":{"ca":"","server":"https://api.dfe8f50.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-014":{"ca":"","server":"https://api.c-9c72d52.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-015":{"ca":"","server":"https://api.d8985a8.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-016":{"ca":"","server":"https://api.b52dc28.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-017":{"ca":"","server":"https://api.b3b8d19.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-018":{"ca":"","server":"https://api.c-8207d68.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-019":{"ca":"","server":"https://api.e2d860b.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-020":{"ca":"","server":"https://api.c-9a00fb6.kyma.ondemand.com","subaccount_group":"teched-02","subaccount_id":"be89cb6d-699a-4b88-9513-891691b67395"},"xp266-021":{"ca":"","server":"https://api.c-140cc98.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-022":{"ca":"","server":"https://api.d0cc3ae.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-023":{"ca":"","server":"https://api.cde9301.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-024":{"ca":"","server":"https://api.a2e3a48.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-025":{"ca":"","server":"https://api.c-5697815.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-026":{"ca":"","server":"https://api.c-22c0dcc.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-027":{"ca":"","server":"https://api.c-2d61b88.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-028":{"ca":"","server":"https://api.b3ab094.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-029":{"ca":"","server":"https://api.c112b29.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"},"xp266-030":{"ca":"","server":"https://api.c-4f642eb.kyma.ondemand.com","subaccount_group":"teched-03","subaccount_id":"73233ae1-e8fe-4ecb-a8ce-f06a48e481ea"}}'
          MATRIX=$(echo "$STATIC" | jq -c --arg t "$TARGET" '
            to_entries
            | map(select($t=="all" or .key==$t or .value.subaccount_group==$t))
            | map({shoot_name:.key, kyma_env_uuid:"", subaccount_id:.value.subaccount_id})
            | {include: .}')
        fi
        echo "teched matrix (target=$TARGET): $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
"name": "all-fleets-teched-admin"
"on":
  "workflow_dispatch":
    "inputs":
      "goose_mode":
        "default": "snapshot"
        "description": "goose reporting mode"
        "options":
        - "snapshot"
        - "live"
        "type": "choice"
      "instructor_subaccount":
        "default": "none"
        "description": "Instructor — (teched-NN / all)"
        "options":
        - "none"
        - "all"
        - "teched-02"
        - "teched-03"
        - "teched-01"
        "type": "choice"
      "keep_sandbox":
        "default": false
        "description": "keep the sandbox alive after the run"
        "type": "boolean"
      "student_cluster":
        "default": "none"
        "description": "Your cluster (xp266-NNN)"
        "options":
        - "none"
        - "xp266-011"
        - "xp266-012"
        - "xp266-013"
        - "xp266-014"
        - "xp266-015"
        - "xp266-016"
        - "xp266-017"
