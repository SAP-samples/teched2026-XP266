            to_entries
            | map(select(.key==$t))
            | map({shoot_name:.key, kyma_env_uuid:"", subaccount_id:.value.subaccount_id})
            | {include: .}')
        fi
        MATRIX_LEN=$(echo "$MATRIX" | jq -r '.include | length')
        if [ "$MATRIX_LEN" = "0" ]; then
          echo "::error::Cluster '$TARGET' not found in the fleet registry. Check the spelling of your Your cluster input (e.g. xp266-003)."
          exit 1
        fi
        echo "teched matrix (student target=$TARGET): $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
"name": "all-fleets-teched-student"
"on":
  "workflow_dispatch":
    "inputs":
      "goose_mode":
        "default": "snapshot"
        "description": "goose reporting mode"
        "options":
        - "snapshot"
        - "live"
        "type": "choice"
      "student_cluster":
        "default": "xp266-NNN"
        "description": "Your cluster (e.g. xp266-003)"
        "type": "string"
"permissions":
  "contents": "read"
  "id-token": "write"
  "issues": "write"
