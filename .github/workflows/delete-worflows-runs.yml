name: Delete older workflows runs

on:
  workflow_dispatch:
    inputs:
      days-ago:
        description: 'Delete runs older than N days (0 = delete all)'
        required: true
        type: string
        default: '0'
      keep-latest:
        description: 'Keep the N most recent runs (0 = disabled)'
        required: false
        type: string
        default: '0'
      dry-run:
        description: 'Dry-run: list deletions without executing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  delete-old-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yanovian/prune-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: ${{ inputs.days-ago }}
          keep-latest: ${{ inputs.keep-latest }}
          dry-run: ${{ inputs.dry-run }}
