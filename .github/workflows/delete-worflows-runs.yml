name: Delete older workflows runs

on:
  workflow_dispatch:
    inputs:
      before-date:
        description: 'Delete runs older than this date (YYYY-MM-DD, UTC). GitHub Actions has no native date picker — type the date.'
        required: true
        type: string
        default: '2026-01-01'
      keep-latest:
        description: 'Keep the N most recent runs (0 = disabled)'
        required: false
        type: string
        default: '0'
      dry-run:
        description: 'Dry-run: list deletions without executing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  delete-old-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute days-ago from before-date
        id: compute
        run: |
          set -euo pipefail
          BEFORE='${{ inputs.before-date }}'
          if ! date -u -d "$BEFORE" '+%Y-%m-%d' > /dev/null 2>&1; then
            echo "::error::Invalid date '$BEFORE' — use YYYY-MM-DD (UTC)"
            exit 1
          fi
          TODAY_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)
          BEFORE_EPOCH=$(date -u -d "$BEFORE" +%s)
          if [ "$BEFORE_EPOCH" -gt "$TODAY_EPOCH" ]; then
            echo "::error::before-date '$BEFORE' is in the future (today UTC: $(date -u +%Y-%m-%d))"
            exit 1
          fi
          DAYS=$(( (TODAY_EPOCH - BEFORE_EPOCH) / 86400 ))
          echo "Computed days-ago=$DAYS from before-date=$BEFORE (today UTC: $(date -u +%Y-%m-%d))"
          echo "days-ago=$DAYS" >> "$GITHUB_OUTPUT"
      - uses: yanovian/prune-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: ${{ steps.compute.outputs.days-ago }}
          keep-latest: ${{ inputs.keep-latest }}
          dry-run: ${{ inputs.dry-run }}
      - name: Summary
        if: always()
        run: |
          {
            echo "## 🧹 Delete older workflow runs"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Before date (UTC) | \`${{ inputs.before-date }}\` |"
            echo "| Computed days-ago | \`${{ steps.compute.outputs.days-ago }}\` |"
            echo "| Keep latest | \`${{ inputs.keep-latest }}\` |"
            echo "| Dry run | \`${{ inputs.dry-run }}\` |"
            echo "| Outcome | \`${{ job.status }}\` |"
            echo ""
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "> ℹ️ **Dry-run mode** — nothing was deleted. See the \`yanovian/prune-old-actions\` step log for the list of runs that *would* have been pruned."
            else
              echo "> 🗑️ **Live mode** — see the \`yanovian/prune-old-actions\` step log for the number of runs actually deleted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
