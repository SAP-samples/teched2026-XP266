name: Delete older workflows runs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  delete-old-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yanovian/prune-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 0
          #keep-latest: 10
          #dry-run: true
